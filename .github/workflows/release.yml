name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Build archive
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Release tag must use vMAJOR.MINOR.PATCH with an optional prerelease suffix'
          }
          $name = "njupt-net_$($env:RELEASE_TAG)_$($env:GOOS)_$($env:GOARCH)"
          $package = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $package | Out-Null
          New-Item -ItemType Directory -Path dist | Out-Null
          $binary = if ($env:GOOS -eq 'windows') { 'njupt-net.exe' } else { 'njupt-net' }
          go build -trimpath -ldflags "-s -w -X main.version=$env:RELEASE_TAG" -o (Join-Path $package $binary) ./cmd/njupt-net
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath README.md, LICENSE, config.example.json -Destination $package
          if ($env:GOOS -eq 'windows') {
            Compress-Archive -Path "$package/*" -DestinationPath "dist/$name.zip"
          } else {
            tar -czf "dist/$name.tar.gz" -C $package $binary README.md LICENSE config.example.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Checksums and draft release
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -File | Sort-Object Name)
          if ($archives.Count -ne 6) { throw 'Expected six platform archives' }
          $checksums = foreach ($file in $archives) {
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS'), $checksums, [System.Text.UTF8Encoding]::new($false))
          $assets = @($archives.FullName) + (Join-Path $PWD 'dist/SHA256SUMS')
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title $env:RELEASE_TAG --generate-notes
          exit $LASTEXITCODE
